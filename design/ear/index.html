<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เลือกหน้าฝึกหู · Mimikopi</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#202627;font-family:"Noto Sans Thai",Tahoma,sans-serif}header{padding:22px 35px 0}h1{margin:0;font-size:25px}p{color:#656f70;margin:6px 0 12px;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #c5cbc8;border-radius:20px;padding:8px 16px;background:white;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 10px}iframe{border:0;width:100%;height:1020px}@media(max-width:900px){main{grid-template-columns:1fr}iframe{height:1030px}}</style><header><h1>หน้าฝึกหู · 3 แบบให้เลือก</h1><p>ต้นแบบที่ลองกดและฟังได้ · ทุกแบบมีหน้ามือถือและหน้าต่อ MIDI · เนื้อหาและเกณฑ์คะแนนเดิม</p><nav><button onclick="send({mode:'midi'})">ดูแบบต่อ MIDI</button><button onclick="send({mode:'phone'})">ดูแบบมือถือ</button><button onclick="send({stage:'gap'})">ช่วงพักก่อนโจทย์</button><button onclick="send({stage:'answer'})">ช่วงรอตอบ</button><button onclick="send({stage:'feedback'})">ช่วงฟังเฉลย</button></nav></header><main><iframe title="A · โฟกัส" src="focus.html?mode=midi"></iframe><iframe title="B · ลำดับชัด" src="steps.html?mode=midi"></iframe><iframe title="C · สตูดิโอ" src="studio.html?mode=midi"></iframe></main><script>function send(data){document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage(data,'*'))}</script></html>
