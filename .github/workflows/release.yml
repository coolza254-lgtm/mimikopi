name: Release

# Build a signed APK and publish it as a release of this repository (with the phone's update file on the fixed
# release "phone-update"). Start it either by pushing a tag like v0.1.0, or manually (Actions tab / API) with a
# version; the manual run tags the commit itself. The old releases repo only gets latest.json while the
# RELEASES_TOKEN secret is still set, so apps up to v0.30 find their way here (learning-system.md 2.11).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0"
        required: true

permissions:
  contents: write
  actions: write  # to start the Windows release of the same version

env:
  # Apps up to v0.30 read their update file there; nothing else is published to it any more.
  LEGACY_RELEASES_REPO: coolza254-lgtm/mimikopi-releases

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like vMAJOR.MINOR.PATCH, got $TAG"; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          NOTES="release-notes/$TAG.md"
          if [[ ! -s "$NOTES" ]]; then echo "::error::Missing Thai release notes $NOTES"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          {
            echo "TAG=$TAG"
            echo "VERSION_NAME=$VER"
            echo "VERSION_CODE=$CODE"
            echo "NOTES_FILE=$NOTES"
          } >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!s}" ]]; then echo "::error::Actions secret $s is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode and check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # SHA-256 of the keystore file itself (not secret); catches truncated/garbled base64.
          EXPECTED_KEYSTORE_SHA256: 4472e34acc1507d4f4e54d0579d93f5f7ccd31d19484860078bb20df657efc6c
        run: |
          KS="$RUNNER_TEMP/release.p12"
          # Pasting into the GitHub form can add spaces or line breaks; base64 and our password never contain them.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KS" || { echo "::error::KEYSTORE_BASE64 is not valid base64"; exit 1; }
          ACTUAL=$(sha256sum "$KS" | cut -d' ' -f1)
          if [[ "$ACTUAL" != "$EXPECTED_KEYSTORE_SHA256" ]]; then
            echo "::error::KEYSTORE_BASE64 does not decode to the expected keystore (got $(stat -c %s "$KS") bytes, sha256 $ACTUAL). Re-paste the whole file content."
            exit 1
          fi
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore (${#PW} characters after trimming; expected 28)."
            exit 1
          fi
          ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS '$ALIAS' is not in the keystore (expected: mimikopi)."
            exit 1
          fi
          echo "Keystore OK"
          echo "MIMIKOPI_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "MIMIKOPI_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "MIMIKOPI_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          MIMIKOPI_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          # MIMIKOPI_KEY_ALIAS, MIMIKOPI_KEYSTORE_PASSWORD and MIMIKOPI_KEY_PASSWORD (PKCS12: same value)
          # come from the check step, trimmed.
        run: >
          ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature and prepare assets
        run: |
          APK_IN=app/build/outputs/apk/release/app-release.apk
          test -f "$APK_IN" || { echo "::error::No signed release APK produced"; ls -R app/build/outputs/apk; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK_IN" | tee signer.txt
          APK="mimikopi-$TAG.apk"
          cp "$APK_IN" "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          python3 - <<PY
          import json, os, datetime
          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          repo = os.environ["GITHUB_REPOSITORY"]; tag = os.environ["TAG"]
          data = {
              "schema": 1,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "tag": tag,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/mimikopi-{tag}.apk",
              "apkSize": $SIZE,
              "sha256": "$SHA256",
              "notesTh": notes,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(data, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          cat latest.json
          echo "APK=$APK" >> "$GITHUB_ENV"

      # The piano sound pack lives in this repository too: copied once from the old releases repo (its descriptor
      # pointed there), so the apps load it from here. Nothing happens once the release exists.
      - name: Make sure the piano sound pack is here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view samples-v1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "samples-v1 already here"; exit 0; fi
          mkdir -p pack && cd pack
          gh release download samples-v1 --repo "$LEGACY_RELEASES_REPO" --pattern 'samples-v1.*'
          python3 - <<'PY'
          import json, os
          d = json.load(open("samples-v1.json", encoding="utf-8"))
          d["url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/samples-v1/samples-v1.zip"
          json.dump(d, open("samples-v1.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          echo "$(python3 -c "import json;print(json.load(open('samples-v1.json'))['sha256'])")  samples-v1.zip" | sha256sum -c -
          gh release create samples-v1 samples-v1.zip samples-v1.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "เสียงเปียโน (Salamander) v1" --notes "ชุดเสียงเปียโนที่แอปดาวน์โหลดเอง · CC BY 3.0 (Salamander Grand Piano V3, Alexander Holm)" --latest=false

      - name: Publish the phone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The APK, in this version's release (also creates the tag on a manual run). The Windows release of the
          # same version is the one marked latest, so the phone's update file has a fixed home of its own.
          gh release create "$TAG" "$APK" latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ミミコピ $VERSION_NAME · มือถือ" --notes-file "$NOTES_FILE" --latest=false
          if ! gh release view phone-update --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create phone-update --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "ไฟล์อัปเดตของแอปมือถือ" --notes "แอปมือถืออ่าน latest.json ที่นี่เพื่อหารุ่นใหม่ ไฟล์ APK อยู่ในรุ่นของแต่ละเวอร์ชัน"
          fi
          gh release upload phone-update latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Tell apps up to v0.30 where the new version is
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then echo "No RELEASES_TOKEN: the old releases repo is left as it is"; exit 0; fi
          # Their update check reads the old repo's newest release; its latest.json points at the APK here.
          gh release create "$TAG" latest.json --repo "$LEGACY_RELEASES_REPO" \
            --title "ミミコピ $VERSION_NAME" --notes-file "$NOTES_FILE" --latest

      # The Windows program is released with the same version and notes, built from the same tagged commit.
      - name: Start the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f version="$VERSION_NAME" -f release=true
