name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK
        run: ./gradlew --stacktrace :core:test :app:lintDebug :app:assembleDebug

      # The build session cannot download artifacts, so print what it needs into the log.
      - name: Print Room schema
        if: always()
        run: |
          for f in app/schemas/*/*.json; do
            [[ -f "$f" ]] || continue
            echo "=== $f"; cat "$f"
            if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::warning::Room schema $f is not committed yet"
            elif ! git diff --quiet -- "$f"; then
              echo "::error::Committed Room schema $f differs from the generated one"; exit 1
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mimikopi-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports and Room schema
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/schemas/
          if-no-files-found: ignore
