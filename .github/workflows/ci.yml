name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # The build session cannot download artifacts, so print what it needs into the log.
      - name: Print Room schema
        if: always()
        run: |
          for f in app/schemas/*/*.json; do
            [[ -f "$f" ]] || continue
            echo "=== $f"; cat "$f"
            if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::warning::Room schema $f is not committed yet"
            elif ! git diff --quiet -- "$f"; then
              echo "::error::Committed Room schema $f differs from the generated one"; exit 1
            fi
          done

      - name: Print lint findings
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.sarif
          [[ -f "$f" ]] || exit 0
          python3 - "$f" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))["runs"]
          results = [r for run in runs for r in run.get("results", [])]
          print(f"lint: {len(results)} finding(s)")
          for r in results:
              loc = r["locations"][0]["physicalLocation"] if r.get("locations") else {}
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              print(f"  [{r.get('level', '?')}] {r['ruleId']}: {path}:{line} {r['message']['text']}")
          PY

      # CI artifacts are optional copies; a storage quota must not override test/lint/build results.
      # Signed release APK publication remains mandatory in release.yml.
      - name: Upload debug APK
        id: debug-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: mimikopi-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports and Room schema
        id: report-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/schemas/
          if-no-files-found: ignore

      - name: Report optional artifact upload failures
        if: always() && (steps.debug-artifact.outcome == 'failure' || steps.report-artifact.outcome == 'failure')
        run: |
          echo "::warning::Optional CI artifacts could not be uploaded. Check upload errors and the Actions storage quota. Test, lint and build results are reported separately; signed APKs are published by the Release workflow."
          echo "### Optional artifact uploads failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the upload steps and Actions storage quota. Test/lint/build results above remain authoritative. Signed APK downloads use GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
